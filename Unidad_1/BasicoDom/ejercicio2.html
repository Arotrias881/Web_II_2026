<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 2 SELECCION DE ELEENTOS LLAMADO POR CLASE</title>
</head>
<body>
    <div class="clase-1">elemento1</div>
    <div class="clase-1">elemento2</div>
    <div class="clase-1">elemento3</div>
    <script>
        const elementos=document.getElementsByClassName("clase-1");
        console.log(elementos);
        for (const elemento of elementos) {
            elemento.textContent="NUEVO TEXTO";
            elemento.style.backgroundColor='blue';
        }
        
    </script>
       
</body>
